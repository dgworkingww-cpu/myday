name: MYDAY quality gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myday-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript-syntax:
    name: JavaScript syntax and inline-script checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run MYDAY quality gate
        run: node scripts/myday-quality-check.mjs
