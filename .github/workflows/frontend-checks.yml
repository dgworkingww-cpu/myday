name: MYDAY frontend checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'schedule-lab.js'
      - 'design-system.css'
      - 'apple-ui.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon.svg'
      - 'tests/**'
      - '.github/workflows/frontend-checks.yml'
  push:
    branches: [main, redesign/myday-apple-2026-v2]
    paths:
      - 'index.html'
      - 'schedule-lab.js'
      - 'design-system.css'
      - 'apple-ui.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon.svg'
      - 'tests/**'
      - '.github/workflows/frontend-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Run real mobile viewport smoke tests
        run: |
          node tests/ui-smoke.cjs
          BROWSER=webkit node tests/ui-smoke.cjs
          node tests/schedule-import-groups.cjs
      - name: Check JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(([, attrs, body]) => !/\bsrc\s*=/.test(attrs) && body.trim())
            .map(([, , body]) => body);
          if (!scripts.length) throw new Error('No inline app script found');
          fs.writeFileSync('/tmp/myday.js', scripts.join('\n;\n'));
          NODE
          node --check /tmp/myday.js
          node --check apple-ui.js
          node --check schedule-lab.js
          node --check sw.js
          node --check backend-config.js
      - name: Validate manifest and app shell
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));
          const html = fs.readFileSync('index.html', 'utf8');
          const sw = fs.readFileSync('sw.js', 'utf8');
          const css = fs.readFileSync('design-system.css', 'utf8');
          if (manifest.short_name !== 'MYDAY') throw new Error('Unexpected PWA short name');
          for (const asset of ['./design-system.css', './backend-config.js', 'manifest.webmanifest']) {
            if (!html.includes(asset)) throw new Error('Missing app-shell reference: ' + asset);
          }
          if (!sw.includes("'./index.html'") || !sw.includes("'./design-system.css'") || !sw.includes("'./apple-ui.js'")) {
            throw new Error('Service worker shell is missing required assets');
          }
          let depth = 0, quote = '', escaped = false;
          for (const ch of css) {
            if (quote) {
              if (escaped) { escaped = false; continue; }
              if (ch === '\\') { escaped = true; continue; }
              if (ch === quote) quote = '';
              continue;
            }
            if (ch === '"' || ch === "'") { quote = ch; continue; }
            if (ch === '{') depth++;
            if (ch === '}') depth--;
            if (depth < 0) throw new Error('CSS has an unexpected closing brace');
          }
          if (depth !== 0 || quote) throw new Error('CSS blocks or strings are unbalanced');
          for (const token of ['--bg:', '--surface:', '--accent:', '--danger:']) {
            if (!css.includes(token)) throw new Error('Missing design token: ' + token);
          }
          console.log('Manifest, app shell and design tokens validated.');
          NODE
      - name: Verify the new design system components
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const css = fs.readFileSync('design-system.css', 'utf8');
          const ui = fs.readFileSync('apple-ui.js', 'utf8');
          const required = ['#nav', '.page-top', '.hero-card', '.metric-grid', '.timeline-list', '.task-item', '.segmented', '.day-strip', '.subject-tile', '.settings-card', '.icon-btn', '.sheet'];
          for (const selector of required) {
            if (!css.includes(selector)) throw new Error('Missing new design component: ' + selector);
          }
          for (const feature of ['window.vToday', 'window.vSched', 'window.vTasks', 'window.vStudy', 'window.vMore', 'window.sheet', 'window.close_']) {
            if (!ui.includes(feature)) throw new Error('Missing rebuilt interaction: ' + feature);
          }
          console.log('All new MYDAY design surfaces and rebuilt screens are present.');
          NODE
