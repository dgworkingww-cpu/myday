name: Deploy MYDAY Supabase backend

on:
  workflow_dispatch:
  push:
    branches:
      - feature/multi-user-myday
    paths:
      - '.github/workflows/deploy-myday-backend.yml'
      - 'supabase/**'

permissions:
  contents: read

concurrency:
  group: myday-supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: rzgsctbvgzerqizfjhuq
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # v2.stable is supported by setup-cli v3 and avoids resolving `latest` via GitHub API.
          # Keep CLI v2 until the workflow is deliberately migrated to CLI v3 semantics.
          version: v2.stable

      - name: Check required secrets
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD TELEGRAM_BOT_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        run: supabase db push --linked --yes

      - name: Set Telegram bot token
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          secret_file="$RUNNER_TEMP/myday-function-secrets.env"
          printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN" > "$secret_file"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --env-file "$secret_file" --yes
          rm -f "$secret_file"

      - name: Deploy Telegram-authenticated sync function
        run: supabase functions deploy myday-sync --project-ref "$SUPABASE_PROJECT_REF"
