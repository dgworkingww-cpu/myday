name: Deploy and validate MYDAY backend

on:
  workflow_dispatch:
  push:
    branches:
      - feature/multi-user-myday
      - feature/myday-telegram-assistant
      - main
    paths:
      - '.github/workflows/deploy-myday-backend.yml'
      - 'supabase/**'
      - 'index.html'
      - 'backend-config.js'
      - 'sw.js'

permissions:
  contents: read

concurrency:
  group: myday-supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: rzgsctbvgzerqizfjhuq
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # v2.stable is supported by setup-cli v3 and avoids resolving `latest` via GitHub API.
          # Keep CLI v2 until the workflow is deliberately migrated to CLI v3 semantics.
          version: v2.stable

      - name: Check required secrets
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OCR_SPACE_API_KEY: ${{ secrets.OCR_SPACE_API_KEY }}
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD TELEGRAM_BOT_TOKEN GROQ_API_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        run: supabase db push --linked --yes

      - name: Set Telegram bot and assistant secrets
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          secret_file="$RUNNER_TEMP/myday-function-secrets.env"
          webhook_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$webhook_secret"
          {
            printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN"
            printf 'MYDAY_WEBHOOK_SECRET=%s\n' "$webhook_secret"
            if [[ -n "${GROQ_API_KEY:-}" ]]; then
              printf 'GROQ_API_KEY=%s\n' "$GROQ_API_KEY"
            fi
          } > "$secret_file"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --env-file "$secret_file" --yes
          rm -f "$secret_file"
          printf '%s' "$webhook_secret" > "$RUNNER_TEMP/myday-webhook-secret"

      - name: Deploy Telegram-authenticated sync function
        run: supabase functions deploy myday-sync --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy isolated MYDAY PDF parser
        run: supabase functions deploy myday-pdf-parser --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy MYDAY Telegram assistant
        run: supabase functions deploy myday-bot --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify Telegram bot token identity
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          (async () => {
            const token = (process.env.TELEGRAM_BOT_TOKEN || '').trim();
            if (!token) throw new Error('TELEGRAM_BOT_TOKEN secret is empty.');
            const response = await fetch('https://api.telegram.org/bot' + token + '/getMe');
            const result = await response.json();
            if (!response.ok || !result.ok) {
              throw new Error('Telegram getMe rejected TELEGRAM_BOT_TOKEN: ' + (result.description || 'HTTP ' + response.status));
            }
            const actualUsername = String(result.result?.username || '');
            if (actualUsername.toLowerCase() !== 'myday20_bot') {
              throw new Error('TELEGRAM_BOT_TOKEN currently belongs to @' + (actualUsername || 'unknown') + ', but MYDAY requires @MYDAY20_BOT. Update this GitHub secret with the token from @BotFather for @MYDAY20_BOT.');
            }
            console.log('Verified Telegram bot: @' + actualUsername + ' (id ' + result.result.id + ')');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Register MYDAY Telegram webhook
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ env.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          webhook_secret="$(cat "$RUNNER_TEMP/myday-webhook-secret")"
          response="$(curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/setWebhook" \
            -H 'Content-Type: application/json' \
            --data "$(jq -n --arg url "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/myday-bot" --arg secret "$webhook_secret" '{url:$url,secret_token:$secret,allowed_updates:["message","callback_query"],drop_pending_updates:false}')")"
          echo "$response" | jq -e '.ok == true' >/dev/null
          menu_response="$(curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/setChatMenuButton" \
            -H 'Content-Type: application/json' \
            --data '{"menu_button":{"type":"web_app","text":"Открыть MYDAY","web_app":{"url":"https://dgworkingww-cpu.github.io/myday/"}}}')"
          echo "$menu_response" | jq -e '.ok == true' >/dev/null
          commands_response="$(curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/setMyCommands" \
            -H 'Content-Type: application/json' \
            --data '{"commands":[{"command":"today","description":"План на сегодня"},{"command":"week","description":"План на 7 дней"},{"command":"tasks","description":"Все открытые задачи"},{"command":"app","description":"Открыть MYDAY"},{"command":"help","description":"Как пользоваться ботом"}]}')"
          echo "$commands_response" | jq -e '.ok == true' >/dev/null
          echo "MYDAY webhook, Mini App menu button and bot commands registered successfully."

      - name: Check frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(([, attrs, body]) => !/\bsrc\s*=/.test(attrs) && body.trim())
            .map(([, , body]) => body);
          if (!scripts.length) throw new Error('No inline JavaScript found in index.html');
          fs.writeFileSync('/tmp/myday-inline.js', scripts.join('\n;\n'));
          NODE
          node --check /tmp/myday-inline.js
          node --check backend-config.js
          node --check sw.js

      - name: Verify signed Telegram auth, database read/write and revision conflicts
        shell: bash
        env:
          SUPABASE_URL: https://rzgsctbvgzerqizfjhuq.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_VBs7WXcOJs8Oh8qNQL2KIw_FBG1ae67
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          import { createHmac } from 'node:crypto';
          const base = process.env.SUPABASE_URL.replace(/\/+$/, '');
          const publishableKey = process.env.SUPABASE_PUBLISHABLE_KEY;
          const botToken = (process.env.TELEGRAM_BOT_TOKEN || '').trim();
          if (!botToken) throw new Error('Missing TELEGRAM_BOT_TOKEN Actions secret');

          // Official Telegram validation vector: catches key/message order regressions independently of our own signer.
          const sampleToken = '5768337691:AAH5YkoiEuPk8-FZa32hStHTqXiLPtAEhx8';
          const sampleSecret = createHmac('sha256', 'WebAppData').update(sampleToken).digest();
          if (sampleSecret.toString('hex') !== 'a5c609aa52f63cb5e6d8ceb6e4138726ea82bbc36bb786d64482d445ea38ee5f') {
            throw new Error('Telegram HMAC secret derivation does not match the official validation vector');
          }
          const sampleCheckString = 'auth_date=1662771648\nquery_id=AAHdF6IQAAAAAN0XohDhrOrc\nuser={"id":279058397,"first_name":"Vladislav","last_name":"Kibenko","username":"vdkfrost","language_code":"ru","is_premium":true}';
          const sampleHash = createHmac('sha256', sampleSecret).update(sampleCheckString).digest('hex');
          if (sampleHash !== 'c501b71e775f74ce10e377dea85a7ea24ecd640b223ea86dfe453e0eaed2e2b2') {
            throw new Error('Telegram initData signature does not match the official validation vector');
          }

          function signedInitData(userId) {
            const params = new URLSearchParams();
            params.set('auth_date', String(Math.floor(Date.now() / 1000)));
            params.set('user', JSON.stringify({ id: userId, first_name: 'MYDAY CI' }));
            const checkString = [...params.entries()]
              .sort(([a], [b]) => a.localeCompare(b))
              .map(([key, value]) => key + '=' + value)
              .join('\n');
            const secret = createHmac('sha256', 'WebAppData').update(botToken).digest();
            const hash = createHmac('sha256', secret).update(checkString).digest('hex');
            params.set('hash', hash);
            return params.toString();
          }

          async function call(initData, action, data, expectedRevision) {
            const response = await fetch(base + '/functions/v1/myday-sync', {
              method: 'POST',
              headers: { apikey: publishableKey, 'Content-Type': 'application/json' },
              body: JSON.stringify({ action, initData, data, expectedRevision })
            });
            return { status: response.status, body: await response.json() };
          }

          const directAccess = await fetch(base + '/rest/v1/myday_profiles?select=telegram_id&limit=1', {
            headers: { apikey: publishableKey }
          });
          if (directAccess.ok) throw new Error('Private profile table is accessible with the public key');

          const invalid = await call('invalid', 'load');
          if (invalid.status !== 401) throw new Error('Invalid Telegram signature was not rejected (HTTP ' + invalid.status + ')');

          const userOne = signedInitData(9007199254740000);
          const loaded = await call(userOne, 'load');
          if (loaded.status !== 200 || !Number.isSafeInteger(loaded.body.revision)) {
            throw new Error('Signed profile load failed: HTTP ' + loaded.status + ' ' + JSON.stringify(loaded.body));
          }

          const expected = loaded.body.revision;
          const payload = { _myday_ci: true, run: process.env.GITHUB_RUN_ID };
          const saved = await call(userOne, 'save', payload, expected);
          if (saved.status !== 200 || saved.body.revision !== expected + 1) {
            throw new Error('Signed profile save failed: HTTP ' + saved.status + ' ' + JSON.stringify(saved.body));
          }

          const conflict = await call(userOne, 'save', { _myday_ci: 'stale-write' }, expected);
          if (conflict.status !== 409 || conflict.body.conflict !== true ||
              conflict.body.revision !== saved.body.revision ||
              conflict.body.data._myday_ci !== true || conflict.body.data.run !== payload.run) {
            throw new Error('Revision conflict protection failed: HTTP ' + conflict.status + ' ' + JSON.stringify(conflict.body));
          }

          const userTwo = signedInitData(9007199254740001);
          const secondLoad = await call(userTwo, 'load');
          if (secondLoad.status !== 200 || !Number.isSafeInteger(secondLoad.body.revision) ||
              (secondLoad.body.data !== null && secondLoad.body.data._myday_ci !== 'second-user')) {
            throw new Error('Telegram account isolation failed: second user saw another profile');
          }
          const secondPayload = { _myday_ci: 'second-user', run: process.env.GITHUB_RUN_ID };
          const secondSave = await call(userTwo, 'save', secondPayload, secondLoad.body.revision);
          if (secondSave.status !== 200) throw new Error('Second Telegram profile save failed: ' + JSON.stringify(secondSave.body));

          const firstReload = await call(userOne, 'load');
          if (firstReload.status !== 200 || firstReload.body.data._myday_ci !== true ||
              firstReload.body.data.run !== payload.run) {
            throw new Error('Telegram account isolation failed: second user changed the first profile');
          }

          console.log('Passed: invalid signatures rejected; signed Telegram identities accepted; profile load/save works; stale writes are blocked; two Telegram accounts remain isolated.');
          NODE
