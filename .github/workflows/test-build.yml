name: Validate MYDAY test build

on:
  push:
    branches:
      - test/myday-unified-schedule-v1
    paths:
      - 'index.html'
      - 'apple-ui.js'
      - 'schedule-lab.js'
      - 'sw.js'
      - 'backend-config.js'
      - '.github/workflows/test-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check schedule-lab.js
          node --check apple-ui.js
          node --check backend-config.js
          node --check sw.js
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(([, attrs, body]) => !/\bsrc\s*=/.test(attrs) && body.trim())
            .map(([, , body]) => body);
          if (!scripts.length) throw new Error('No inline JavaScript found');
          fs.writeFileSync('/tmp/myday-inline.js', scripts.join('\n;\n'));
          NODE
          node --check /tmp/myday-inline.js
          echo "All JavaScript syntax checks passed."
