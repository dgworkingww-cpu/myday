name: Validate MYDAY frontend and sync

on:
  push:
    branches:
      - feature/multi-user-myday
    paths:
      - 'index.html'
      - 'backend-config.js'
      - 'sw.js'
      - 'supabase/**'
      - '.github/workflows/validate-myday-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myday-validation
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(([, attrs, body]) => !/\bsrc\s*=/.test(attrs) && body.trim())
            .map(([, , body]) => body);
          if (!scripts.length) throw new Error('No inline JavaScript found in index.html');
          fs.writeFileSync('/tmp/myday-inline.js', scripts.join('\n;\n'));
          NODE
          node --check /tmp/myday-inline.js
          node --check backend-config.js
          node --check sw.js
      - name: Verify signed Telegram auth, database read/write and revision conflicts
        shell: bash
        env:
          SUPABASE_URL: https://rzgsctbvgzerqizfjhuq.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_VBs7WXcOJs8Oh8qNQL2KIw_FBG1ae67
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          import { createHmac } from 'node:crypto';
          const base = process.env.SUPABASE_URL.replace(/\/+$/, '');
          const publishableKey = process.env.SUPABASE_PUBLISHABLE_KEY;
          const botToken = process.env.TELEGRAM_BOT_TOKEN;
          if (!botToken) throw new Error('Missing TELEGRAM_BOT_TOKEN Actions secret');

          const params = new URLSearchParams();
          params.set('auth_date', String(Math.floor(Date.now() / 1000)));
          params.set('user', JSON.stringify({ id: 4000000000000000, first_name: 'MYDAY CI' }));
          const checkString = [...params.entries()]
            .sort(([a], [b]) => a.localeCompare(b))
            .map(([key, value]) => `${key}=${value}`)
            .join('\n');
          const secret = createHmac('sha256', botToken).update('WebAppData').digest();
          const hash = createHmac('sha256', secret).update(checkString).digest('hex');
          params.set('hash', hash);
          const initData = params.toString();

          async function call(action, data, expectedRevision) {
            const response = await fetch(`${base}/functions/v1/myday-sync`, {
              method: 'POST',
              headers: { apikey: publishableKey, 'Content-Type': 'application/json' },
              body: JSON.stringify({ action, initData, data, expectedRevision })
            });
            return { status: response.status, body: await response.json() };
          }

          const invalid = await fetch(`${base}/functions/v1/myday-sync`, {
            method: 'POST',
            headers: { apikey: publishableKey, 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'load', initData: 'invalid' })
          });
          if (invalid.status !== 401) throw new Error(`Invalid Telegram signature was not rejected (HTTP ${invalid.status})`);

          const loaded = await call('load');
          if (loaded.status !== 200 || !Number.isSafeInteger(loaded.body.revision)) {
            throw new Error(`Signed profile load failed: HTTP ${loaded.status} ${JSON.stringify(loaded.body)}`);
          }

          const expected = loaded.body.revision;
          const payload = { _myday_ci: true, run: process.env.GITHUB_RUN_ID };
          const saved = await call('save', payload, expected);
          if (saved.status !== 200 || saved.body.revision !== expected + 1) {
            throw new Error(`Signed profile save failed: HTTP ${saved.status} ${JSON.stringify(saved.body)}`);
          }

          const conflict = await call('save', { _myday_ci: 'stale-write' }, expected);
          if (conflict.status !== 409 || conflict.body.conflict !== true ||
              conflict.body.revision !== saved.body.revision ||
              JSON.stringify(conflict.body.data) !== JSON.stringify(payload)) {
            throw new Error(`Revision conflict protection failed: HTTP ${conflict.status} ${JSON.stringify(conflict.body)}`);
          }

          console.log('Passed: invalid signatures rejected; signed Telegram identity accepted; database load/save works; stale writes return HTTP 409 without overwriting newer data.');
          NODE
