name: Deploy MYDAY Telegram assistant

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/myday-bot/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myday-bot-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: rzgsctbvgzerqizfjhuq
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable
      - name: Check deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy MYDAY Telegram assistant
        run: supabase functions deploy myday-bot --project-ref "$SUPABASE_PROJECT_REF"
