<script>
const DAYS=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const CATS=['Учёба','Личные дела','Покупки','Автомобиль','Работа и проекты','Другое'];
const PR=['Низкий','Средний','Высокий'],ST=['Не начато','В процессе','Выполнено'];
const id=()=>Math.random().toString(36).slice(2,9);
const TY={'Л':'#91ad91','ПЗ':'#cfaa73','ЛЗ':'#75a79a'};
const tyP=l=>{const m=(l.room||'').split(' · ');return m.length>1&&TY[m[0]]?`<span class="pill" style="background:${TY[m[0]]}33;color:${TY[m[0]]}">${m[0]}</span>`:''};
const roomOf=l=>(l.room||'').split(' · ').pop();
const guess=s=>/(^|\s)послезавтра/i.test(s)?addDays(today(),2):/(^|\s)завтра/i.test(s)?addDays(today(),1):/(^|\s)сегодня/i.test(s)?today():'';
function liveHtml(){const n=new Date(),L=lessons(n),m=n.getHours()*60+n.getMinutes(),mm=s=>+s.slice(0,2)*60+ +s.slice(3),cur=L.find(l=>mm(l.s)<=m&&m<mm(l.e));
 if(cur)return `<div class="card hero"><div class="sub">Идёт сейчас · до конца ${mm(cur.e)-m} мин</div><div class="big" style="font-size:20px">${e(cur.subj)}</div><div class="sub">${cur.s}–${cur.e} · ${e(roomOf(cur))}</div><div class="bar" style="margin-top:10px"><i style="width:${(m-mm(cur.s))/(mm(cur.e)-mm(cur.s))*100}%"></i></div></div>`;
 const nx=L.find(l=>mm(l.s)>m);if(!nx)return '';const d=mm(nx.s)-m;
 return `<div class="card"><span class="tag">Следующая пара · через ${d>=60?Math.floor(d/60)+' ч '+d%60+' мин':d+' мин'}</span><div><b>${e(nx.subj)}</b></div><div class="tag">${tyP(nx)}${nx.s}–${nx.e} · ${e(roomOf(nx))}</div></div>`}
const catGuess=s=>{s=s.toLowerCase();return /курсов|лаборатор|конспект|зач[её]т|экзамен|лекци|универ|домашк|реферат/.test(s)?'Учёба':/заправк|масл|шиномонт|шины|мойк|альмер|техосмотр|осаго|автомобил/.test(s)?'Автомобиль':/купить|куплю|магазин|продукт|заказать|аптек/.test(s)?'Покупки':/клиент|проект|заказчик|созвон|встреч|отч[её]т|работ/.test(s)?'Работа и проекты':''};
function capHint(){const v=$('#cq').value.trim(),h=$('#chint');if(!v){h.innerHTML='';return}
 const P=v.split(/;|\s+и\s+|\n/).map(s=>s.trim()).filter(Boolean),n=P.length,d=guess(v),cs=[...new Set(P.map(catGuess).filter(Boolean))],sp=$('#cs').checked;
 h.innerHTML=(d?`<span class="pill">Срок: ${fmt(d)}</span>`:'')+cs.map(c=>`<span class="pill">${c}</span>`).join('')+(n>1&&!sp?`<button class="pill" style="border:0;color:var(--ac)" onclick="$('#cs').checked=true;capHint()">Разбить на ${n}</button>`:'')+(sp&&n>1?`<span class="pill">${n} задачи</span>`:'')}
function dragStart(ev,tid){const h=ev.currentTarget,el=h.closest('.dr'),y0=ev.clientY;h.setPointerCapture(ev.pointerId);el.classList.add('drag');let z=null;
 const mv=e2=>{el.style.transform=`translateY(${e2.clientY-y0}px) scale(1.02)`;z=document.elementsFromPoint(e2.clientX,e2.clientY).find(n=>n.classList&&n.classList.contains('zone'))||null;document.querySelectorAll('.zone').forEach(q=>q.classList.toggle('hot',q==z))};
 const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);if(z){const t=S.tasks.find(x=>x.id==tid);if(t&&t.prio!=+z.dataset.p){t.prio=+z.dataset.p;save()}}render()};
 h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up)}
let ft=null,cm=0,cdsel=null,sw=null;
function excSet(lid,k,type,o){S.exc=S.exc||[];const a=S.exc.find(z=>z.date==k&&(z.lid==lid||z.id==lid));if(a){if(a.type=='add'){if(type=='cancel')S.exc=S.exc.filter(z=>z!=a);else a.o=o}else{a.type=type;a.o=o}}else S.exc.push({date:k,lid,type,o});save();close_();render()}
const excSave=(l,k)=>excSet(l,k,'mod',{s:$('#x1').value,e:$('#x2').value,room:$('#x3').value,subj:$('#x4').value});

function excReset(l,k){S.exc=(S.exc||[]).filter(z=>!(z.date==k&&z.lid==l));save();close_();render()}
function addExtra(k){const i0='x'+id();S.exc=S.exc||[];S.exc.push({date:k,id:i0,type:'add',o:{s:'09:00',e:'10:30',room:'',subj:'Пара'}});save();lessonDay(i0,k)}
function lessonDay(lid,k){const l=lessons(new Date(k+'T12:00')).find(x=>x.id==lid);if(!l)return;sheet(`<h1>${e(l.subj)}</h1><div class="sub">${fmt(k)} · только этот день, сетка не меняется</div><div class="row" style="margin:10px 0"><div class="grow"><label>Начало</label><input id="x1" type="time" value="${l.s}"></div><div class="grow"><label>Конец</label><input id="x2" type="time" value="${l.e}"></div></div><label>Аудитория</label><input id="x3" value="${e(l.room)}"><label>Предмет</label><input id="x4" value="${e(l.subj)}"><button class="btn" style="width:100%;margin-bottom:8px" onclick="excSave('${lid}','${k}')">Сохранить</button><div class="row"><button class="btn r grow" onclick="excCancel('${lid}','${k}')">Отменить пару</button>${l.chg&&!String(lid).startsWith('x')?`<button class="btn g grow" onclick="excReset('${lid}','${k}')">Как в сетке</button>`:''}</div>`)}
function excRows(k){const n=new Date(k+'T12:00'),base=(scheduleBucket('study',wk(n))[n.getDay()]||[]);return (S.exc||[]).filter(z=>z.date==k&&z.type=='cancel').map(z=>{const l=base.find(b=>b.id==z.lid)||{subj:'Пара'};return `<div class="card row" style="padding:9px 14px;opacity:.6"><div class="grow tag" style="text-decoration:line-through">${e(l.subj)}</div><button class="btn g" style="padding:4px 12px" onclick="excReset('${z.lid}','${k}')">Вернуть</button></div>`}).join('')+`<button class="btn g" style="width:100%;margin-top:4px" onclick="addExtra('${k}')">+ Пара только на сегодня</button>`}
function search(){sheet(`<input id="sq" aria-label="Поиск по задачам и заданиям" placeholder="Поиск по задачам и заданиям" oninput="doSearch()"><div id="sr" aria-live="polite"></div>`);setTimeout(()=>$('#sq').focus(),60)}
function doSearch(){const q=$('#sq').value.trim().toLowerCase();if(!q){$('#sr').innerHTML='';return}const R=[...S.tasks.map(t=>({...t,k:'t'})),...S.hw.map(h=>({...h,k:'h',title:subj(h.subj)+': '+h.title}))].filter(x=>(x.title+' '+(x.desc||'')).toLowerCase().includes(q)).slice(0,30);$('#sr').innerHTML=R.length?R.map(x=>`<div class="card" onclick="detail('${x.k}','${x.id}')"><div class="${x.status==2?'t done':''}">${e(x.title)}</div><div class="tag">${x.due?fmt(x.due)+' · ':''}${ST[x.status]}</div></div>`).join(''):'<div class="sub">Ничего не найдено</div>'}
function calView(){const b=new Date();b.setDate(1);b.setMonth(b.getMonth()+cm);const y=b.getFullYear(),m=b.getMonth(),off=(b.getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),all=[...S.tasks,...S.hw].filter(x=>x.due&&x.status!=2),cnt={};all.forEach(x=>cnt[x.due]=(cnt[x.due]||0)+1);(S.events||[]).forEach(z=>cnt[z.date]=(cnt[z.date]||0)+1);let c='';for(let i=0;i<off;i++)c+='<div></div>';for(let d=1;d<=dim;d++){const k=y+'-'+pad(m+1)+'-'+pad(d),n=cnt[k]||0,s=k==cdsel;c+=`<div onclick="cdsel='${k}';render()" style="text-align:center;padding:8px 0;border-radius:12px;${k==today()?'border:1px solid var(--ac);':''}${s?'background:var(--ac);color:#fff;':''}">${d}<div style="height:8px;font-size:8px;color:${s?'#fff':'var(--ac)'}">${'●'.repeat(Math.min(n,3))}</div></div>`}const sel=cdsel?all.filter(x=>x.due==cdsel):[];
 return `<header><button class="btn g" onclick="st=null;render()">‹ Назад</button></header><div class="row" style="justify-content:space-between"><button class="btn g" onclick="cm--;render()">‹</button><b>${b.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</b><button class="btn g" onclick="cm++;render()">›</button></div><div class="card" style="margin-top:10px"><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="tag" style="text-align:center">${x}</div>`).join('')}${c}</div></div>`+(cdsel?`<h2>${fmt(cdsel)}</h2>`+(sel.length?sel.map(x=>row(x.subj?{...x,k:'h',title:subj(x.subj)+': '+x.title}:x)).join(''):'<div class="sub">Дедлайнов нет</div>')+evRows(cdsel):'')+`<button class="btn g" style="width:100%;margin-top:8px" onclick="evForm()">+ Зачёт / экзамен</button>`}
function weekView(){const all=allOpen();return `<header><button class="btn g" onclick="st=null;render()">‹ Назад</button></header><h1>План недели</h1>`+[...Array(7)].map((_,i)=>addDays(today(),i)).map(k=>{const d=new Date(k+'T12:00'),L=lessons(d),T=all.filter(x=>x.due==k),ld=Math.min(100,L.length*14+T.length*18);return `<div class="card"><div class="row"><b class="grow">${DAYS[d.getDay()]}, ${fmt(k)}</b><span class="tag">${L.length} пар · ${T.length} дел</span></div><div class="bar" style="margin:8px 0"><i style="width:${ld}%;${ld>80?'background:var(--er)':''}"></i></div>${T.slice(0,3).map(x=>`<div class="tag">• ${e(x.title)}</div>`).join('')}</div>`}).join('')}
const tplHtml=()=>(S.tpl||[]).map((t,i)=>`<span style="display:inline-flex;margin:0 6px 6px 0"><button class="btn g" style="padding:6px 12px;border-radius:99px 0 0 99px" onclick="tplUse(${i})">${e(t)}</button><button class="btn g" style="padding:6px 10px;border-radius:0 99px 99px 0;color:var(--er)" onclick="tplDel(${i})">×</button></span>`).join('');
const tplUse=i=>{$('#cq').value=S.tpl[i];capHint()};
function tplAdd(){const v=$('#cq').value.trim();if(!v)return;S.tpl=S.tpl||[];if(!S.tpl.includes(v))S.tpl.push(v);save();$('#tpl').innerHTML=tplHtml()}
function tplDel(i){S.tpl.splice(i,1);save();$('#tpl').innerHTML=tplHtml()}
function stages(i){const h=S.hw.find(y=>y.id==i);['Введение и постановка задач','Теоретическая часть','Расчёты','Графическая часть / чертежи','Оформление и список литературы','Подготовка к защите'].forEach(t=>h.subs.push({t,d:false}));save();detail('h',i);render()}
function fcs(k,i){const x=(k=='t'?S.tasks:S.hw).find(y=>y.id==i);sheet(`<h1>Фокус</h1><div class="sub">${e(x.title)}</div><div class="big" id="fc" style="font-size:56px;text-align:center;margin:18px 0">25:00</div><div class="row"><button class="btn grow" id="fb" onclick="fToggle('${k}','${i}')">Старт</button><button class="btn g" onclick="close_()">Скрыть</button></div><div class="tag" style="margin-top:8px">Всего в фокусе: ${x.mins||0} мин. Таймер идёт, пока приложение открыто.</div>`);fShow()}
function fShow(){const c=$('#fc');if(!c)return;const r=ft?Math.max(0,Math.round((ft.end-Date.now())/1000)):1500;c.textContent=pad(Math.floor(r/60))+':'+pad(r%60);const b=$('#fb');if(b)b.textContent=ft?'Стоп':'Старт'}
function fToggle(k,i){if(ft)fEnd(false);else{ft={end:Date.now()+15e5,k,i,iv:setInterval(()=>{if(Date.now()>=ft.end)fEnd(true);else fShow()},1000)};fShow()}}
function fEnd(done){clearInterval(ft.iv);const x=(ft.k=='t'?S.tasks:S.hw).find(y=>y.id==ft.i),m=done?25:Math.floor((15e5-(ft.end-Date.now()))/6e4);if(x&&m>0){x.mins=(x.mins||0)+m;(S.focus=S.focus||[]).push({d:today(),m});save()}ft=null;fShow();if(done)notify('Фокус завершён','25 минут прошло — делайте перерыв 5 минут')}
function rem(h,a){const txt=a.slice(0,4).map(x=>x.title).join('\n');if(!notify(h,txt)&&!$('#ov'))sheet(`<h1>${h}</h1><p style="white-space:pre-line">${e(txt)}</p><button class="btn" onclick="close_()">Ок</button>`)}
document.addEventListener('touchstart',ev=>{const c=ev.target.closest&&ev.target.closest('.card[data-id]');if(!c||ev.target.closest('.hd,.chk'))return;const t=ev.touches[0];sw={c,x:t.clientX,y:t.clientY,dx:0,lock:0}},{passive:true});
document.addEventListener('touchmove',ev=>{if(!sw)return;const t=ev.touches[0],dx=t.clientX-sw.x,dy=t.clientY-sw.y;if(!sw.lock){if(Math.abs(dy)>10){sw=null;return}if(Math.abs(dx)>10)sw.lock=1}if(sw.lock){sw.dx=dx;sw.c.style.transition='none';sw.c.style.transform=`translateX(${dx}px)`;sw.c.style.background=dx>0?'color-mix(in srgb,var(--ok) 28%,var(--card))':'color-mix(in srgb,var(--ac) 28%,var(--card))'}},{passive:true});
document.addEventListener('touchend',()=>{if(!sw)return;const {c,dx}=sw;sw=null;c.style.transition='transform .2s';if(Math.abs(dx)>90){const k=c.dataset.k,x=(k=='t'?S.tasks:S.hw).find(y=>y.id==c.dataset.id);if(!x){render();return}if(dx>0){if(x.status!=2){finish(k,x);save();c.classList.add('out');toast('Выполнено',()=>tog(k,x.id));setTimeout(render,300)}else render()}else{const od=x.due;x.due=addDays(today(),1);if(k=='h')x.needDue=0;save();render();toast('Перенесено на завтра',()=>{x.due=od;save();render()})}}else{c.style.transform='';c.style.background=''}});
function uiIcon(name){const p={sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>',moon:'<path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.8 8.8 0 1 0 20.5 14.2Z"/>',system:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18Z"/>',appearance:'<rect x="3" y="4" width="18" height="16" rx="4"/><path d="M12 4v16"/>',calendar:'<rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M7 3v4m10-4v4M4 10h16m-9 4h.01M15 14h.01M8 17h.01"/>',bell:'<path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/>',database:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v7c0 1.7 3.6 3 8 3s8-1.3 8-3V5m-16 7v7c0 1.7 3.6 3 8 3s8-1.3 8-3v-7"/>',offline:'<path d="M4 4l16 16M8.5 8.5A5 5 0 0 1 17 12m-9 4a5 5 0 0 0 8.5 1.5M3 9a13 13 0 0 1 3-2.5M21 9a13 13 0 0 0-2-2"/>',back:'<path d="m15 18-6-6 6-6"/>',close:'<path d="m18 6-12 12M6 6l12 12"/>',plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="10.8" cy="10.8" r="6.3"/><path d="m16 16 4 4"/>'};return '<svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(p[name]||p.system)+'</svg>'}
const AC=[['#5b67e8','#4652cf'],['#1685d5','#086bb5'],['#159b88','#087d70'],['#d66c62','#b84e49'],['#8b63d9','#7048bd']];
let tt,sd0=null;
function toast(m,undo){const o=$('#toast');if(o)o.remove();clearTimeout(tt);const d=document.createElement('div');d.id='toast';d.className='toast';d.setAttribute('role','status');d.setAttribute('aria-live','polite');d.setAttribute('aria-atomic','true');d.innerHTML=`<span>${e(m)}</span>${undo?'<button class="toast-undo" type="button">Отменить</button>':''}`;if(undo)d.querySelector('button').onclick=()=>{undo();d.remove()};document.body.appendChild(d);tt=setTimeout(()=>d.remove(),4500)}
function restoreBak(){const b=localStorage.getItem(localStoreKey+':session-bak')||localStorage.getItem('myday2_bak');if(!b)return alert('Автокопии пока нет');if(!confirm('Вернуть данные на момент начала последнего сеанса?'))return;try{S=JSON.parse(b);save();render()}catch(_){alert('Копия повреждена')}}
const evRows=k=>(S.events||[]).map((z,i)=>({z,i})).filter(o=>o.z.date==k).map(o=>`<div class="card row"><span class="pill" style="background:var(--ac);color:#fff">${e(o.z.type)}</span><div class="grow">${e(o.z.title)}</div><button class="chk" style="border:0;color:var(--er)" onclick="evDel(${o.i})">×</button></div>`).join('');

const NI={today:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',sched:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>',tasks:'<circle cx="12" cy="12" r="8"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/>',study:'<path d="M4 6c3-1 6-1 8 1 2-2 5-2 8-1v12c-3-1-6-1-8 1-2-2-5-2-8-1z"/>',more:'<circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/>'};

function sheet(h){const q=$('#ov'),replacing=!!q;if(q)q.remove();else{window._dialogTrigger=document.activeElement!==document.body?document.activeElement:null;window._dialogOverflow=document.body.style.overflow;document.body.style.overflow='hidden'}const o=document.createElement('div');o.className='ov'+(replacing?' nos':'');o.id='ov';o.onclick=ev=>{if(ev.target===o)close_()};o.innerHTML='<div class="sheet" role="dialog" aria-modal="true" tabindex="-1"><div class="grab" aria-hidden="true"></div><button class="sheet-close" type="button" aria-label="Закрыть" onclick="close_()">×</button>'+h+'</div>';document.body.appendChild(o);const panel=o.querySelector('.sheet'),title=panel.querySelector('h1');if(title){title.id=title.id||'dialog-title';panel.setAttribute('aria-labelledby',title.id);title.tabIndex=-1}else panel.setAttribute('aria-label','Диалог');panel.querySelectorAll('label').forEach(l=>{if(l.htmlFor||l.querySelector('input,select,textarea'))return;const f=l.nextElementSibling;if(f&&f.matches('input,select,textarea')){if(!f.id)f.id='field-'+id();l.htmlFor=f.id}});panel.addEventListener('keydown',ev=>{if(ev.key==='Escape'){ev.preventDefault();close_();return}if(ev.key!=='Tab')return;const a=[...panel.querySelectorAll('button:not(:disabled),a[href],input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex]:not([tabindex="-1"])')].filter(x=>x.offsetParent!==null);if(!a.length){ev.preventDefault();panel.focus();return}if(ev.shiftKey&&document.activeElement===a[0]){ev.preventDefault();a[a.length-1].focus()}else if(!ev.shiftKey&&document.activeElement===a[a.length-1]){ev.preventDefault();a[0].focus()}});setTimeout(()=>{if(!o.isConnected)return;const target=title||panel;target.focus({preventScroll:true})},0)}
function close_(){const o=$('#ov');if(o){o.id='';o.classList.add('bye');setTimeout(()=>{o.remove();document.body.style.overflow=window._dialogOverflow||'';const t=window._dialogTrigger;window._dialogTrigger=null;if(t&&t.isConnected)t.focus({preventScroll:true})},230)}}

 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

function capSave(){const v=$('#cq').value.trim();if(!v)return;const d=$('#cd').value;
 if($('#ck').value=='i')S.inbox.unshift({text:v,d:today()});else{const parts=$('#cs').checked?v.split(/;|\s+и\s+|\n/).map(s=>s.trim()).filter(Boolean):[v];parts.forEach(p=>S.tasks.push(mk({title:p,due:d||guess(p)||guess(v),cat:catGuess(p)||catGuess(v)||'Другое'})))}

function notify(title,body){try{if(!('Notification' in window)||Notification.permission!='granted')return false;const opts={body,tag:'myday-'+title,renotify:false};if('serviceWorker' in navigator&&navigator.serviceWorker.controller){navigator.serviceWorker.ready.then(reg=>reg.showNotification(title,opts)).catch(()=>{try{new Notification(title,opts)}catch(_){}})}else new Notification(title,opts);return true}catch(_){return false}}
function tick(){
 const n=new Date(),t=today(),hm=pad(n.getHours())+':'+pad(n.getMinutes()),F=S.fired;
 Object.keys(F).forEach(k=>{if(!k.startsWith(t)&&!k.startsWith('x'))delete F[k]});
 const L=lessons(n);
 if(hm>=S.settings.morning&&!F[t+'m']){F[t+'m']=1;save();if(L.length){const txt='Сегодня '+DAYS[n.getDay()].toLowerCase()+', '+wkName(wk()).split(' ')[0]+' неделя.\n'+L.map(l=>l.s+' — '+l.subj).join('\n')+(allOpen().some(x=>x.due&&x.due<=t)?'\nЗадач на сегодня и просроченных: '+allOpen().filter(x=>x.due&&x.due<=t).length:'');if(!notify('Доброе утро!',txt))sheet(`<h1>Доброе утро!</h1><p style="white-space:pre-line">${e(txt)}</p><button class="btn" onclick="close_()">Ок</button>`)}}
 if(L.length){const last=L[L.length-1].e,[h,m]=last.split(':').map(Number),at=new Date(n);at.setHours(h,m+S.settings.hwDelay,0,0);
  if(n>=at&&!F[t+'h']&&(!F[t+'s']||n.getTime()>F[t+'s'])&&!$('#ov')){hwPrompt()}}
 if(hm>='18:00'&&!F[t+'r']){F[t+'r']=1;const a=allOpen().filter(x=>x.due==addDays(t,1));if(a.length){save();rem('Завтра срок',a)}}
 if(hm>='15:00'&&!F[t+'q']){F[t+'q']=1;const a=allOpen().filter(x=>x.due==t);if(a.length){save();rem('Сегодня срок',a)}}
 const lv=$('#live');if(tab=='today'&&lv&&!$('#ov')){const h=liveHtml();if(lv.innerHTML!==h)lv.innerHTML=h}}

 sheet(`<h1>Занятия на сегодня закончились</h1><div class="sub">Какие задания тебе задали?</div><label>Предмет</label><select id="hp">${S.subjects.filter(s=>!s.closed).map(s=>`<option value="${s.id}">${e(s.name)}</option>`).join('')}</select>

function hpSave(){const t=$('#ht').value.trim();if(!t)return fieldError($('#ht'),'Опишите задание');S.hw.push({id:id(),subj:$('#hp').value,title:t,desc:'',due:$('#hd').value,status:0,subs:[],photos:[]});S.fired[today()+'h']=1;save();close_();render()}
function migrate(){S=normalizeProfile(S);if(!S.settings.weekAnchor){S.settings.weekAnchor=weekStartKey();S.settings.weekAnchorType=((isoWeek(new Date())+(S.settings.shift||0))%2==1?'odd':'even')}S.sched=S.sched||{odd:{},even:{},work:{}};S.sched.odd=S.sched.odd||{};S.sched.even=S.sched.even||{};S.sched.work=S.sched.work||{};S.subjects=S.subjects||[];S.hw=S.hw||[];S.exc=S.exc||[];S.events=S.events||[];save()}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}migrate();render();try{const mq=window.matchMedia('(prefers-color-scheme: light)');mq.addEventListener?mq.addEventListener('change',()=>{if(S.settings.theme==='auto'&&!(tgApp&&tgApp.colorScheme))render()}):mq.addListener&&mq.addListener(()=>{if(S.settings.theme==='auto'&&!(tgApp&&tgApp.colorScheme))render()});tgApp&&tgApp.onEvent&&tgApp.onEvent('themeChanged',()=>{if(S.settings.theme==='auto')render()})}catch(_){}initCloud();tick();setInterval(tick,30000);setInterval(()=>{if(!document.hidden)cloudPull()},20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();render();cloudPull()}});
